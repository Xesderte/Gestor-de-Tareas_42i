services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestor_tareas_backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestor_tareas_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
